name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests custom_components
      - name: Mypy
        run: python -m mypy src tests
      - name: Pytest
        run: python -m pytest -q
